<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="多语言电子书文库 - 汇聚全球经典书籍">
    <title>多语言电子书文库 | Multilingual E-Book Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <h1>多语言电子书文库</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <section class="search-section">
            <div class="search-box">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索书名、作者、ISBN...">
                <button id="clearSearch" class="clear-btn" aria-label="清除搜索" style="display:none;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </section>

        <section class="filter-section">
            <div class="filter-group">
                <span class="filter-label">语言</span>
                <div class="tag-group" id="languageTags">
                    <button class="tag active" data-language="all">全部</button>
                    <button class="tag" data-language="zh">中文</button>
                    <button class="tag" data-language="en">English</button>
                    <button class="tag" data-language="ja">日本語</button>
                    <button class="tag" data-language="ko">한국어</button>
                    <button class="tag" data-language="fr">Français</button>
                    <button class="tag" data-language="es">Español</button>
                    <button class="tag" data-language="de">Deutsch</button>
                    <button class="tag" data-language="ru">Русский</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">分类</span>
                <div class="tag-group" id="categoryTags">
                    <button class="tag active" data-category="all">全部</button>
                    <button class="tag" data-category="novel">小说</button>
                    <button class="tag" data-category="scifi">科幻</button>
                    <button class="tag" data-category="history">历史</button>
                    <button class="tag" data-category="philosophy">哲学</button>
                    <button class="tag" data-category="biography">传记</button>
                    <button class="tag" data-category="programming">编程</button>
                    <button class="tag" data-category="poetry">诗歌</button>
                    <button class="tag" data-category="economy">经济</button>
                </div>
            </div>
            <div class="filter-group sort-group">
                <span class="filter-label">排序</span>
                <select id="sortSelect" class="sort-select">
                    <option value="rating-desc">评分从高到低</option>
                    <option value="rating-asc">评分从低到高</option>
                    <option value="year-desc">年份从新到旧</option>
                    <option value="year-asc">年份从旧到新</option>
                    <option value="title-asc">名称 A-Z</option>
                    <option value="title-desc">名称 Z-A</option>
                </select>
            </div>
        </section>

        <section class="results-info">
            <span id="resultCount">加载中...</span>
        </section>

        <section id="loadingState" class="loading-state">
            <div class="loader"></div>
            <p>正在加载书籍数据...</p>
        </section>

        <section id="emptyState" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <h3>没有找到匹配的书籍</h3>
            <p>试试调整筛选条件或搜索关键词</p>
        </section>

        <section id="bookGrid" class="book-grid"></section>
    </main>

    <button id="backToTop" class="back-to-top" aria-label="回到顶部" style="display:none;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button id="modalClose" class="modal-close" aria-label="关闭">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 多语言电子书文库 | Multilingual E-Book Library</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
